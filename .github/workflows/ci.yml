name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest pytest-asyncio

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "tests/ 不存在，跳过 pytest（P0-e 脚手架就绪后自动执行）"
          fi

  frontend:
    name: Miniapp lint (guarded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # miniapp 脚手架由 P0-f 交付，尚不存在时整段跳过。
      # 注：hashFiles 依赖已 checkout 的工作区，job 级 if 求值时文件尚未拉取，
      # 因此守卫放在 step 级而非 job 级。
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        with:
          node-version: 20

      - name: Install & lint
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        run: |
          npm install --no-audit --no-fund
          npm run lint --if-present
