name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 真实 PG/Redis：pytest 的 db_* 夹具走真实 PostgreSQL（docs/split/07 §9.1 接口测试）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 指向 service 容器（端口映射到 runner 的 localhost）
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_coach
      REDIS_URL: redis://127.0.0.1:6379/0
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest pytest-asyncio

      - name: Load DB schema
        # schema 位于仓库根 data/，此处覆盖 job 默认工作目录
        working-directory: .
        run: psql -h 127.0.0.1 -U postgres -d ai_coach -v ON_ERROR_STOP=1 -f data/sql/001_schema.sql

      - name: Load reference seeds
        # 参照数据是大量用例的前置：sku_catalog（如 code=FD-001）、食物库与别名、RAG 知识库。
        # 只建表不导种子会让 test_merchants / smoke 等批量 NoResultFound 失败
        # （Phase 5 审查实测：空库口径 66 条失败，导入后全绿）。
        working-directory: .
        run: |
          python data/load_seeds.py \
            --dsn "postgresql://postgres:postgres@127.0.0.1:5432/ai_coach" \
            --file food:data/seeds/food_full.csv \
            --file food_alias:data/seeds/food_alias_full.csv \
            --file sku_catalog:data/seeds/standard_sku.sample.csv \
            --file ai_knowledge:data/seeds/rag_knowledge.sample.jsonl

      - name: Ruff check (non-blocking)
        # 仅提示不阻断：仓库既有后端源码存在存量告警（B008：FastAPI 以 Depends(...)
        # 作函数默认值；UP045/I001 等风格项），属脚手架既有风格。
        # Phase 1 以「回归测试全绿」为准，lint 只做可见性提示、不拦截 CI。
        run: |
          ruff check . || echo "::warning::ruff check 存在存量告警（B008/UP045/I001 等），CI 不阻断"

      - name: Black check (non-blocking)
        # 文档 §13.4「代码风格：Python 用 ruff + black」。与 Ruff 一致取自 backend/pyproject.toml
        # 的 [tool.black]（line-length=100/py312）；同为非阻断：存量未格式化文件只提示不拦截。
        run: |
          black --check . || echo "::warning::black --check 存在未格式化文件，CI 不阻断"

      - name: Pytest
        run: pytest -q

  frontend:
    name: Miniapp type-check & build (guarded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # miniapp 脚手架由 P0-f 交付，尚不存在时整段跳过。
      # 注：hashFiles 依赖已 checkout 的工作区，job 级 if 求值时文件尚未拉取，
      # 因此守卫放在 step 级而非 job 级。
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        with:
          node-version: 20

      # package.json 无 lint 脚本（原 npm run lint --if-present 属空跑）；
      # 改为真实的类型检查 + 两个构建目标。
      # build:h5 仍在 CI 跑，但口径要说清：**H5 不进部署面**（deploy/Dockerfile.miniapp 与 nginx
      # 的 SPA root/静态缓存/回退三段已删，不产出也不上传任何 H5 部署物）。保留的原因是
      # 源码里所有 `#ifdef H5` 分支**只有 H5 构建才会被编译**，而 build:h5/dev:h5 是本项目
      # 唯一的 agent-browser 视觉回归通道（AGENTS.md §5）——不在 CI 构建它就等于没人守这条通道，
      # 腐化后（类型/依赖/条件编译错误）只有人工跑脚本时才会发现。
      - name: Install & type-check
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        run: |
          npm install --no-audit --no-fund
          npm run type-check

      # CI/CD **只部署后端**（cd.yml 仅 build `Dockerfile.backend`）；小程序包由微信开发者工具上传、
      # 经公众平台审核发布，**不经过本流水线**。因此下面两个 build 只是编译检查，不是发布产物，
      # 也不在这里断言"发布域名"——那是上传前由人填的事。
      - name: Build mp-weixin (编译检查，非 CI 部署面)
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        # 仓库 .env.production 的 VITE_API_BASE 故意留空（只对 H5 同源成立），CI 里拿不到发布域名
        # 是**正常状态**。构建能过即达目的；万一有人拿空 baseURL 的产物去上传，运行期由
        # src/api/request.ts 的 `#ifdef MP-WEIXIN` 断言在启动时抛错兜住，不会退化成静默零请求。
        run: npm run build:mp-weixin

      - name: Build H5 (视觉回归通道，非部署面)
        if: ${{ hashFiles('miniapp/package.json') != '' }}
        working-directory: miniapp
        # 命令级把 VITE_API_BASE 置空 = H5 同源（deploy/nginx.conf 反代 /api）。
        # 保留本步骤的唯一目的是防 `#ifdef H5` 分支腐化——它们只有 H5 构建才会编译。
        run: VITE_API_BASE= npm run build:h5

  admin:
    name: Admin type-check & build (guarded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # admin 脚手架由 P0 交付，尚不存在时整段跳过（与 frontend job 同风格）。
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('admin/package.json') != '' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # admin 的 build 脚本 = vue-tsc --noEmit && vite build，兼作类型门禁。
      - name: Install & build
        if: ${{ hashFiles('admin/package.json') != '' }}
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ---- compose 自动部署验证：每次 push 真实编排起全栈并探活（部署即验证，F9/§10.7）----
  # 语义：backend/frontend/admin 证明「代码正确」，本 job 证明「编排可部署」——
  # Dockerfile、compose、schema 初始化、nginx、Prometheus 采集、Grafana 装配任一坏掉即红。
  # 末尾附带原 deploy.yml 的 pytest 门禁（2026-10-03 并入）：复用本 job 构建的
  # ai-coach-api:${GIT_SHA} 镜像，在 5433 隔离测试库跑全量回归。
  compose-deploy:
    name: Compose deploy & verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
      # 超管账号凭据：003 种子已不再创建 admin（超管真源是根 .env，见
      # data/sql/003_phase3_admin_seed.sql 头注释），故不能再从种子注释 grep 凭据。
      # 口令【只有 secret 源】：必须在仓库 Settings → Secrets 里配 ADMIN_INIT_PASSWORD。
      # 这里曾写 `|| 'ci-only-not-a-real-secret-0001'` 兜底，而该串能通过 init_admin.py
      # 的弱口令校验 → CI 起栈会把超管口令写成仓库里的公开字符串。现改为不配即失败。
      # 用户名不是秘密，且弱口令检查不针对它，故保留字面兜底 ci-admin。
      ADMIN_INIT_USERNAME: ${{ secrets.ADMIN_INIT_USERNAME || vars.ADMIN_INIT_USERNAME || 'ci-admin' }}
      ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # compose 的 migrate 服务按 .env 建超管（scripts/init_admin.py --optional）。
      # CI 需要这个 .env，否则超管不会被创建，冒烟登录就无账号可用。
      # 【幂等合并】而非覆盖：runner 上若已存在 .env（含 WECHAT_*/JWT_SECRET 等），
      # `> ` 截断会把它冲掉。故已存在的键一律不覆盖。
      - name: Write .env for compose (admin bootstrap)
        run: |
          set -e
          # 未配置 secret 必须响亮失败：静默降级成公开口令比失败危险得多。
          if [ -z "${ADMIN_INIT_PASSWORD}" ]; then
            echo "::error::未配置 secret ADMIN_INIT_PASSWORD（仓库 Settings → Secrets）。拒绝用公开口令兜底建超管。"
            exit 1
          fi
          umask 077
          touch .env
          grep -q '^ADMIN_INIT_USERNAME=' .env || echo "ADMIN_INIT_USERNAME=${ADMIN_INIT_USERNAME}" >> .env
          grep -q '^ADMIN_INIT_PASSWORD=' .env || echo "ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}" >> .env
          echo ".env 已合并超管凭据（仅追加缺失键；值不回显）"

      - name: Build & start full stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          docker compose -f deploy/docker-compose.yml ps

      - name: Wait for API healthy
        run: |
          status=""
          for i in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ai-coach-api 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            docker compose -f deploy/docker-compose.yml logs --tail 50
            exit 1
          fi

      - name: Verify endpoints (nginx → api → db/redis)
        run: |
          set -e
          # 1. nginx 探活
          [ "$(curl -fsS http://127.0.0.1/healthz)" = "ok" ]

          # 2. C 端登录守卫（独立断言）：上面创建的 .env 只含超管凭据，不含微信凭证
          #    （WECHAT_APPID/WECHAT_SECRET）→ /api/auth/login 必须失败。原「无凭证时
          #    openid=md5(code)」的 mock 分支已删除（它会伪造身份），故此处断言 1001
          #    正是新守卫生效的证据。
          #    注意：1001 映射 HTTP 401，curl -f 会先非零退出，因此这里改用 -w 取状态码 + 读 body。
          http=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://127.0.0.1/api/auth/login \
            -H 'Content-Type: application/json' -d '{"code":"ci-compose-smoke"}')
          echo "auth/login http=$http body=$(cat /tmp/login.json)"
          [ "$http" = "401" ]
          grep -q '"code":1001' /tmp/login.json

          # 3. 鉴权可用（冒烟主线走管理端）：超管由 compose 的 migrate 服务按 .env
          #    里的 ADMIN_INIT_USERNAME/ADMIN_INIT_PASSWORD 创建（scripts/init_admin.py），
          #    003 种子只再建 ops/merchant1，不再创建 admin，故这里**不能**再从 003 注释
          #    grep 凭据（已 grep 不到）。凭据来自上面注入的 workflow env。
          #    请求体用 json.dumps 结构化构造：原来的 CREDS="${U}/${P}" + ${CREDS%%/*}
          #    在口令含 / 时会被截断，且直接插值会产出非法 JSON（引号注入面）。
          [ -n "${ADMIN_INIT_USERNAME}" ] && [ -n "${ADMIN_INIT_PASSWORD}" ] \
            || { echo "未注入 ADMIN_INIT_USERNAME/ADMIN_INIT_PASSWORD"; exit 1; }
          ADMIN_TOKEN=$(curl -fsS -X POST http://127.0.0.1/api/admin/login \
            -H 'Content-Type: application/json' \
            -d "$(U="$ADMIN_INIT_USERNAME" P="$ADMIN_INIT_PASSWORD" python3 -c 'import json,os;print(json.dumps({"username":os.environ["U"],"password":os.environ["P"]}))')" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['token'])")
          [ -n "$ADMIN_TOKEN" ]
          # 4. 带 token 真实读库：sku-catalog 读的是 migrate 导入的 sku_catalog（5 条），
          #    code=0 同时证明「nginx→api→db」链路 + JWT 鉴权 + 种子导入三者都通。
          curl -fsS http://127.0.0.1/api/admin/sku-catalog -H "Authorization: Bearer $ADMIN_TOKEN" \
            | grep -q '"code":0'
          # 5. 反向对照：同一接口不带 token 必须 401/1001（证明鉴权真在生效，不是"接口全开"）
          anon=$(curl -s -o /tmp/anon.json -w '%{http_code}' http://127.0.0.1/api/admin/sku-catalog)
          echo "anon admin/sku-catalog http=$anon body=$(cat /tmp/anon.json)"
          [ "$anon" = "401" ]
          grep -q '"code":1001' /tmp/anon.json
          # 6. PostGIS 就位（0008 依赖）：geometry 扩展存在
          docker exec ai-coach-postgres psql -U postgres -d ai_coach -tAc \
            "SELECT extname FROM pg_extension WHERE extname='postgis'" | grep -q postgis
          # 7. schema 自动初始化生效：核心表存在
          docker exec ai-coach-postgres psql -U postgres -d ai_coach -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | awk '{ if ($1 < 30) exit 1 }'
          # 8. 种子导入生效（migrate 服务）：食物库有量。
          #    原断言用登录 token 打 POST /api/food/search 检索"鸡胸肉"，现 C 端无凭证拿不到
          #    token，改用 SQL 直接核对行数（HTTP 侧的参照数据命中已由第 4 步 sku_catalog 覆盖）。
          docker exec ai-coach-postgres psql -U postgres -d ai_coach -tAc \
            "SELECT count(*) FROM food" | awk '{ if ($1 < 100) exit 1 }'
          # 9. alembic 版本已对齐（migrate 服务 stamp/upgrade；一次性容器已退出，用临时容器查）
          docker compose -f deploy/docker-compose.yml run --rm migrate \
            sh -c "cd /app && alembic current" | grep -q "(head)"

      - name: Verify monitoring (prometheus scrape + grafana provisioning)
        run: |
          set -e
          curl -fsS http://127.0.0.1:9090/-/ready
          curl -fsS http://127.0.0.1:3000/api/health
          # 等首个采集周期（scrape_interval 15s）后断言 api target UP
          sleep 20
          curl -fsS 'http://127.0.0.1:9090/api/v1/query' \
            --get --data-urlencode 'query=up{job="ai-coach-api"}' \
            | grep -qE '"value":\[[0-9.]+,"1"\]'
          # Grafana 数据源与看板自动装配（uid 与 dashboard.json 引用一致）
          curl -fsS -u admin:admin http://127.0.0.1:3000/api/datasources/prometheus/uid | grep -q prometheus

      # ---- 隔离测试库 pytest 门禁（原 deploy.yml test job，2026-10-03 并入）----
      # conftest.db_session 会 TRUNCATE 大量业务表，因此**绝不能指向上面部署库**：
      # 在 5433 起一个独立的 PostGIS 测试库跑完即销毁。
      - name: Start isolated test database
        # schema 走 /docker-entrypoint-initdb.d 在初始化阶段建表：
        # 容器启动后 PG 会「初始化 → 重启」一次，此时 psql 导入会被掐断
        # （FATAL: terminating connection due to administrator command）。
        run: |
          set -e
          docker rm -f ai-coach-test-pg >/dev/null 2>&1 || true
          docker run -d --name ai-coach-test-pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ai_coach_test \
            -v "$(pwd)/data/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro" \
            -p 5433:5432 postgis/postgis:16-3.4
          # 就绪判定：连续两次查询成功（跨过初始化后的重启）
          ok=0
          for i in $(seq 1 60); do
            if docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc "SELECT 1" >/dev/null 2>&1; then
              sleep 3
              if docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc "SELECT 1" >/dev/null 2>&1; then
                echo "PG ready after ${i} tries"; ok=1; break
              fi
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { docker logs --tail 30 ai-coach-test-pg; exit 1; }
          docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'"

      - name: Load reference seeds (test DB)
        # 复用本 job 前面 compose build 出的后端镜像（依赖齐全），宿主只读挂载 data/
        run: |
          set -e
          docker run --rm --network=host \
            -v "$(pwd)/data:/app/data:ro" -w /app \
            "ai-coach-api:${GIT_SHA}" \
            python data/load_seeds.py \
              --dsn "postgresql://postgres:postgres@127.0.0.1:5433/ai_coach_test" \
              --file food:data/seeds/food_full.csv \
              --file food_alias:data/seeds/food_alias_full.csv \
              --file sku_catalog:data/seeds/standard_sku.sample.csv \
              --file ai_knowledge:data/seeds/rag_knowledge.sample.jsonl

      - name: Pytest (isolated test DB)
        # 挂载仓库源码跑测试（镜像只提供依赖环境）：部分用例
        # （test_contract_consistency）按 __file__.parents[2] 定位仓库根的
        # contracts/openapi.yaml、miniapp/src/types/api.d.ts，镜像内只有 backend/ 会 FileNotFoundError。
        run: |
          set -e
          docker run --rm --network=host -w /repo/backend \
            -v "$(pwd):/repo:ro" \
            -e DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/ai_coach_test" \
            "ai-coach-api:${GIT_SHA}" \
            sh -c "pip install -q pytest pytest-asyncio \
                   -i https://pypi.tuna.tsinghua.edu.cn/simple/ \
                   && python -m pytest -q -p no:cacheprovider"

      - name: Teardown
        if: always()
        run: |
          docker rm -f ai-coach-test-pg >/dev/null 2>&1 || true
          docker compose -f deploy/docker-compose.yml down -v --remove-orphans
