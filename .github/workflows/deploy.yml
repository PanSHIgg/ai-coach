# ============================================================
# CI/CD 闭环：push main → 部署（重建镜像 + compose 重新部署 + 探活）→ pytest 门禁
#
# 位置 .github/workflows/：Gitea Actions 与 GitHub Actions **同一份文件通用**
# （Gitea Actions 兼容 .github/workflows，已实测触发）。
#
# 与 GitHub Actions 写法保持一致：用官方 `uses: actions/checkout@v4`。
# 本地 Gitea 侧的做法（模拟 GitHub 的 actions 组织）：
#   1. 把 github.com/actions/* 官方 action 仓库镜像到本实例 actions/* 组织下；
#   2. Gitea 配 [actions] DEFAULT_ACTIONS_URL=self，uses: 即解析到本实例而非 github.com；
#      → 无需访问 github.com，写法与 GitHub 完全一致。
#   3. runner 为 host 模式（等价 self-hosted runner），job 直接在宿主机执行，可直接调 docker/compose。
#   4. 沙箱 9090 已被占用 → Prometheus 端口改映射 9091（compose 支持环境变量覆盖）。
# 注：actions/setup-python 之类需要联网下载运行时（python 发行版）的 action 本环境仍不可用，
#     故测试改为复用后端镜像自带的 python3.12 跑 pytest（效果等价）。
# ============================================================
name: Deploy (compose rebuild)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 镜像 tag：与 compose 中 image: ai-coach-api:${GIT_SHA} 对应，便于按 sha 回滚
  GIT_SHA: ${{ github.sha }}
  PROMETHEUS_PORT: "9091"
  COMPOSE_FILE: deploy/docker-compose.yml
  # 超管凭据：003 种子已不再创建 admin（真源是根 .env，见该种子文件头注释），
  # 不能再从种子注释 grep。用 workflow 变量注入，生产必须在仓库 Secrets 配同名 secret。
  # 口令【只有 secret 源】：这里曾写 `|| 'deploy-only-not-a-real-secret-0001'` 兜底，
  # 而该串能通过 init_admin.py 的弱口令校验 → 每次 push main 都把生产超管口令
  # 改写成仓库里的公开字符串（init_admin.py 在"密码不匹配"分支无条件 UPDATE）。
  # 现改为不配即失败（见下面 Write .env step 的断言），不再降级成公开口令。
  # 用户名不是秘密，且弱口令检查不针对它，故保留字面兜底 deploy-admin。
  ADMIN_INIT_USERNAME: ${{ secrets.ADMIN_INIT_USERNAME || vars.ADMIN_INIT_USERNAME || 'deploy-admin' }}
  ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}

jobs:
  deploy:
    name: Build & deploy full stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Runner context
        run: |
          echo "date      = $(date -Is)"
          echo "pwd       = $(pwd)"
          echo "ref       = ${GITHUB_REF}"
          echo "sha       = ${GITHUB_SHA}"
          echo "workspace = ${GITHUB_WORKSPACE}"
          echo "server    = ${GITHUB_SERVER_URL}"
          echo "repo      = ${GITHUB_REPOSITORY}"
          echo "docker    = $(docker --version)"
          echo "compose   = $(docker compose version)"
          ls -la

      # 与 GitHub 一致的标准写法：actions/checkout
      # （本地 Gitea 已把 actions/* 官方仓库镜像到 actions 组织，并设 DEFAULT_ACTIONS_URL=self）
      - uses: actions/checkout@v4

      - name: Locate source
        run: |
          SRC="${GITHUB_WORKSPACE:-$(pwd)}"
          [ -f "$SRC/deploy/docker-compose.yml" ] || SRC="$(pwd)"
          echo "$SRC" > /tmp/ai-coach-src
          echo "SRC = $SRC"
          cd "$SRC" && git log --oneline -3

      # compose 的 migrate 服务按根 .env 建超管（scripts/init_admin.py --optional）。
      # 这里是【幂等合并】而非覆盖：部署机可能已预置含 WECHAT_APPID/SECRET、
      # JWT_SECRET、POSTGRES_PASSWORD、COS_* 的 .env，用 `> ` 无条件截断会把它们
      # 全冲掉 → 真微信登录失效、JWT_SECRET 退回 config.py 的仓库可读硬编码常量
      #（任何人可伪造 admin token）、DB 口令丢失。故已存在的键一律不覆盖，
      # 部署机的人工配置优先。
      - name: Write .env for compose (admin bootstrap)
        run: |
          set -e
          SRC="${GITHUB_WORKSPACE:-$(pwd)}"
          [ -f "$SRC/deploy/docker-compose.yml" ] || SRC="$(pwd)"
          # 未配置 secret 必须响亮失败：静默降级成公开口令比失败危险得多。
          if [ -z "${ADMIN_INIT_PASSWORD}" ]; then
            echo "::error::未配置 secret ADMIN_INIT_PASSWORD（仓库 Settings → Secrets）。拒绝用公开口令兜底建超管。"
            exit 1
          fi
          umask 077
          touch "$SRC/.env"
          grep -q '^ADMIN_INIT_USERNAME=' "$SRC/.env" || echo "ADMIN_INIT_USERNAME=${ADMIN_INIT_USERNAME}" >> "$SRC/.env"
          grep -q '^ADMIN_INIT_PASSWORD=' "$SRC/.env" || echo "ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}" >> "$SRC/.env"
          echo ".env 已合并超管凭据到 $SRC（仅追加缺失键；值不回显）"

      - name: Build images
        # compose up 无法透传 --build-arg，故先 build 再 up。
        # PIP_INDEX_URL 必须覆盖：Dockerfile 默认的 mirrors.tencent.com 在 buildkit 内
        # 会出现 SSL UNEXPECTED_EOF（实测清华源在 buildkit 内可用）。
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          export GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          echo "GIT_SHA = $GIT_SHA"
          docker compose -f "$COMPOSE_FILE" build \
            --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple/
          docker images --format "{{.Repository}}:{{.Tag}}" | grep ai-coach-api

      - name: Deploy (recreate containers)
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          export GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          docker compose -f "$COMPOSE_FILE" up -d --force-recreate
          docker compose -f "$COMPOSE_FILE" ps

      - name: Wait for API healthy
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ai-coach-api 2>/dev/null || echo "missing")
            echo "ai-coach-api health=$s (try $i/60)"
            [ "$s" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::API 未在 5 分钟内进入 healthy"
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail=120
          exit 1

      - name: Smoke check (nginx → api → db → 鉴权正反对照 → 监控)
        # 口径对齐仓库 ci.yml（去 Mock 之后）：CI 不建 .env → 无微信凭证 → /api/auth/login
        # 必须 401 + code 1001；冒烟主线改走管理端种子账号。
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          echo "--- 1) nginx /healthz ---"
          [ "$(curl -fsS http://127.0.0.1/healthz)" = "ok" ] && echo "healthz=ok"

          echo "--- 2) C 端登录守卫：无凭证必须 401/1001（新守卫生效证据）---"
          # 1001 映射 HTTP 401，curl -f 会先非零退出，故取状态码 + 读 body
          http=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://127.0.0.1/api/auth/login \
            -H 'Content-Type: application/json' -d '{"code":"ci-compose-smoke"}')
          echo "auth/login http=$http body=$(head -c 200 /tmp/login.json)"
          [ "$http" = "401" ] && grep -q '"code":1001' /tmp/login.json

          echo "--- 3) 后台超管登录（凭据来自 workflow env，003 不再创建 admin）---"
          [ -n "${ADMIN_INIT_USERNAME}" ] && [ -n "${ADMIN_INIT_PASSWORD}" ] \
            || { echo "未注入 ADMIN_INIT_USERNAME/ADMIN_INIT_PASSWORD"; exit 1; }
          # 请求体用 json.dumps 结构化构造：原来的 CREDS="${U}/${P}" + ${CREDS%%/*} 在口令
          # 含 / 时会被截断，且直接插值会产出非法 JSON（引号注入面）。
          ADMIN_TOKEN=$(curl -fsS -X POST http://127.0.0.1/api/admin/login \
            -H 'Content-Type: application/json' \
            -d "$(U="$ADMIN_INIT_USERNAME" P="$ADMIN_INIT_PASSWORD" python3 -c 'import json,os;print(json.dumps({"username":os.environ["U"],"password":os.environ["P"]}))')" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['token'])")
          [ -n "$ADMIN_TOKEN" ] && echo "admin token 获取成功"

          echo "--- 4) 带 token 真实读库（nginx→api→db + JWT + migrate 种子 三者通）---"
          curl -fsS http://127.0.0.1/api/admin/sku-catalog \
            -H "Authorization: Bearer $ADMIN_TOKEN" | grep -q '"code":0' && echo "sku-catalog code=0"

          echo "--- 5) 反向对照：不带 token 必须 401/1001（证明鉴权真在生效）---"
          anon=$(curl -s -o /tmp/anon.json -w '%{http_code}' http://127.0.0.1/api/admin/sku-catalog)
          echo "anon http=$anon body=$(head -c 200 /tmp/anon.json)"
          [ "$anon" = "401" ] && grep -q '"code":1001' /tmp/anon.json

          echo "--- 6) postgis 扩展 + 种子行数 ---"
          docker exec ai-coach-postgres psql -U postgres -d ai_coach -tAc \
            "SELECT extname FROM pg_extension WHERE extname='postgis'" | grep -q postgis
          docker exec ai-coach-postgres psql -U postgres -d ai_coach -tAc \
            "SELECT count(*) FROM food" | awk '{ print "food rows =", $1; if ($1 < 100) exit 1 }'

          echo "--- 7) 监控栈 ---"
          curl -fsS http://127.0.0.1:9091/-/ready; echo
          curl -fsS http://127.0.0.1:3000/api/health; echo

      - name: Deployed image
        run: |
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}" | grep ai-coach-api || true
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep ai-coach || true

      - name: Dump logs on failure
        if: failure()
        run: |
          cd "$(cat /tmp/ai-coach-src)"
          docker compose -f "$COMPOSE_FILE" ps || true
          docker compose -f "$COMPOSE_FILE" logs --tail=200 || true

  # ---- 后端回归测试：部署通过后跑 pytest（门禁）----
  # 注意：conftest.db_session 会 TRUNCATE 大量业务表，因此**绝不能指向部署库**，
  # 这里在 5433 起一个独立的 PostGIS 测试库跑完后即销毁。
  test:
    name: Backend pytest (isolated test DB)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_PG_PORT: "5433"
      TEST_DB: ai_coach_test
      TEST_DSN: postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/ai_coach_test

    steps:
      - uses: actions/checkout@v4

      - name: Locate source
        run: |
          SRC="${GITHUB_WORKSPACE:-$(pwd)}"
          [ -f "$SRC/deploy/docker-compose.yml" ] || SRC="$(pwd)"
          echo "$SRC" > /tmp/ai-coach-src
          echo "SRC = $SRC"
          cd "$SRC" && git log --oneline -1

      - name: Start isolated test database
        # schema 走 /docker-entrypoint-initdb.d 在初始化阶段建表：
        # 容器启动后 PG 会「初始化 → 重启」一次，此时 psql 导入会被掐断
        # （FATAL: terminating connection due to administrator command）。
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          docker rm -f ai-coach-test-pg >/dev/null 2>&1 || true
          docker run -d --name ai-coach-test-pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ai_coach_test \
            -v "$(pwd)/data/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro" \
            -p 5433:5432 postgis/postgis:16-3.4
          # 就绪判定：连续两次查询成功（跨过初始化后的重启）
          ok=0
          for i in $(seq 1 60); do
            if docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc "SELECT 1" >/dev/null 2>&1; then
              sleep 3
              if docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc "SELECT 1" >/dev/null 2>&1; then
                echo "PG ready after ${i} tries"; ok=1; break
              fi
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { docker logs --tail 30 ai-coach-test-pg; exit 1; }
          docker exec ai-coach-test-pg psql -U postgres -d ai_coach_test -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'"

      - name: Load reference seeds
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          export GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          echo "--- seeds（复用后端镜像，依赖齐全）---"
          docker run --rm --network=host \
            -v "$(pwd)/data:/app/data:ro" -w /app \
            "ai-coach-api:${GIT_SHA}" \
            python data/load_seeds.py \
              --dsn "postgresql://postgres:postgres@127.0.0.1:5433/ai_coach_test" \
              --file food:data/seeds/food_full.csv \
              --file food_alias:data/seeds/food_alias_full.csv \
              --file sku_catalog:data/seeds/standard_sku.sample.csv \
              --file ai_knowledge:data/seeds/rag_knowledge.sample.jsonl

      - name: Pytest
        run: |
          set -e
          cd "$(cat /tmp/ai-coach-src)"
          export GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          # 挂载仓库源码跑测试（镜像只提供依赖环境）：
          # 部分用例（test_contract_consistency）按 __file__.parents[2] 定位仓库根的
          # contracts/openapi.yaml、miniapp/src/types/api.d.ts，镜像内只有 backend/ 会 FileNotFoundError。
          docker run --rm --network=host -w /repo/backend \
            -v "$(pwd):/repo:ro" \
            -e DATABASE_URL="$TEST_DSN" \
            "ai-coach-api:${GIT_SHA}" \
            sh -c "pip install -q pytest pytest-asyncio \
                   -i https://pypi.tuna.tsinghua.edu.cn/simple/ \
                   && python -m pytest -q -p no:cacheprovider"

      - name: Teardown test database
        if: always()
        run: docker rm -f ai-coach-test-pg >/dev/null 2>&1 || true
