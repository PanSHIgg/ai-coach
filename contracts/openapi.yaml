      properties:
        tier: { type: integer, description: 0基础 1进阶 2高级 3终身 }
        ai_times_left: { type: integer }
        coach_times_left: { type: integer }
        valid_to: { type: string, format: date-time, nullable: true, description: 'NULL=不限期/基础档' }
