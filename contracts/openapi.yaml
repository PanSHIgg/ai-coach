  # ---- 上传（COS 直传）----
  /api/upload/credential:
    post:
      tags: [上传]
      summary: 获取 COS 直传临时凭证（STS；公开读/私有写）
      operationId: getUploadCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCredentialIn'
      responses:
        '200':
          description: >-
            STS 临时密钥 + 建议对象键 + 公开读 URL；COS 未配置时 configured=false 且 credentials=null
            （前端跳过直传，不伪造可用）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadCredentialData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
