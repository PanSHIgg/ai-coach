  /api/user/avatar:
    post:
      tags: [用户档案]
      summary: 更新当前用户头像（COS 公开读 URL）
      operationId: updateUserAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUpdateIn'
      responses:
        '200':
          description: 更新后的当前用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <token>；未带返回 1001'
    MerchantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '商家自助域 Authorization: Bearer <token>（/api/merchant/login 换发，独立于用户 JWT）；未带返回 1001'
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    Unauthorized:
      description: 未认证（code=1001 未登录/Token 失效）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 1001 }
    Forbidden:
      description: 无权限（code=1002）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 1002 }
    Validation422:
      description: 参数校验失败（code=2001，errors 带字段明细）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 2001 }
                  errors:
                    type: object
                    additionalProperties: true
                    example: { amount_g: 'must be greater than 0' }
    NotFound404:
      description: 资源不存在（code=3001）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 3001 }
    MerchantClosed:
      description: 商家停业（code=5001）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 5001 }
    CouponInvalid:
      description: 券不可用（code=5002 过期/不满足门槛）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 5002 }
    OrderTimeout:
      description: 订单已超时（code=5003）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 5003 }
    RedeemUsed:
      description: 核销码已使用（code=5004）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 5004 }
    QuotaExceeded:
      description: 余额/次数不足（code=4001）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 4001 }
    AiUnavailable:
      description: AI 服务暂不可用（code=6001，降级返回预设 FAQ，不卡死）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 6001 }
    InviteLimit:
      description: 邀请已达上限（code=7001）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 7001 }
    RateLimited:
      description: 限流（【假设】code 复用 HTTP 429）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 429 }
    ServerError:
      description: 服务错（【假设】code 复用 HTTP 500）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  code: { const: 500 }
  schemas:
    Envelope:
      type: object
      description: 统一响应 envelope；失败时 data 为 null、errors 可选
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 成功；非 0 见 05 文档 §8.2 错误码表
        message:
          type: string
        data:
          description: 业务数据，失败时为 null
        request_id:
          type: string
        errors:
          type: object
          additionalProperties: true
          description: 校验/业务错误明细，成功时缺省
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total: { type: integer, example: 1 }
    MealType:
      type: integer
      description: 1早餐 2午餐 3晚餐 4加餐
      enum: [1, 2, 3, 4]
    RecordSource:
      type: integer
      description: 1拍照 2语音 3手动 4AI推荐
      enum: [1, 2, 3, 4]
    OrderStatus:
      type: integer
      description: 1待支付 2已支付待核销 3已完成 4已取消 5已退款
      enum: [1, 2, 3, 4, 5]
    CouponStatus:
      type: integer
      description: 1未用 2已用 3过期 4作废
      enum: [1, 2, 3, 4]
    CouponType:
      type: integer
      description: 1满减 2折扣 3免费 4体验
      enum: [1, 2, 3, 4]
    CouponScope:
      type: integer
      description: 1吃 2动 3异业 4通用
      enum: [1, 2, 3, 4]
    UserBrief:
      type: object
      required: [id, nickname]
      properties:
        id: { type: integer }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }
    LoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 微信 wx.login 返回的 code
        encrypted_data: { type: string, nullable: true }
        iv: { type: string, nullable: true }
    LoginData:
      type: object
      required: [token, refresh_token, is_new, need_profile, user]
      properties:
        token: { type: string }
        refresh_token: { type: string }
        is_new: { type: boolean }
        need_profile: { type: boolean, description: 需要引导补全身体档案 }
        user:
          $ref: '#/components/schemas/UserBrief'
    UserBenefit:
      type: object
      properties:
        tier: { type: integer, description: 0基础 1进阶 2高级 3终身 }
        ai_times_left: { type: integer }
    UserDetail:
      type: object
      required: [id, nickname]
      properties:
        id: { type: integer }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }
        gender: { type: integer, nullable: true, description: 0未知 1男 2女 }
        benefit:
          $ref: '#/components/schemas/UserBenefit'
    TargetType:
      type: integer
      description: 1减脂 2增肌 3维持
      enum: [1, 2, 3]
    ActivityLevel:
      type: integer
      description: 1卧床 2久坐 3轻度 4中度 5高度
      enum: [1, 2, 3, 4, 5]
    BodyProfileIn:
      type: object
      required: [gender, height_cm, current_weight]
      properties:
        gender: { enum: [1, 2], description: 1男 2女, type: integer }
