# AI 饮食管控教练 · API 契约（P0-d 冻结版）
# 来源：docs/split/05-API接口文档.md §8.3（34 接口）；统一响应/错误码见 §8.1/8.2 与 04-后端技术架构与数据库.md。
# 修改纪律：先改本文件 → 重新生成 TS（bash gen-ts.sh）→ 同步 pydantic schemas → 通知对端。
openapi: 3.1.0
info:
  title: AI 饮食管控教练 API
  version: 0.1.0
  description: |
    统一响应 envelope：
      成功 {"code":0,"message":"ok","data":{...},"request_id":"..."}
      失败 {"code":<非0>,"message":"...","data":null,"errors":{...}}
    HTTP 状态码映射：参数错 422(2001) / 未认证 401(1001) / 无权限 403(1002) / 资源不存在 404(3001) / 业务错 409(4001~7001) / 限流 429 / 服务错 500。
    通用错误码：0 成功 / 1001 未登录 / 1002 无权限 / 2001 参数校验失败 / 3001 资源不存在 / 4001 余额次数不足 /
    4002 重复请求（幂等拦截）/ 5001 商家停业 / 5002 券不可用 / 5003 订单已超时 / 5004 核销码已使用 /
    6001 AI 服务暂不可用 / 7001 邀请已达上限 / 4102 邀请防刷拦截（同设备只计 1 次有效邀请）。
    幂等与防重放（Phase 5 / F6）：写接口（POST/PUT/PATCH/DELETE）可携带 `Idempotency-Key` 请求头
      （客户端为每个逻辑操作生成唯一值）。同一身份 + 同一 key 在 300s 窗口内重复到达时，仅首次放行，
      其余返回 **409 + 4002**（响应体另含 "idempotency_replayed": true）。未携带该头的请求行为不变。
    运维端点（不在 /api 契约内）：GET /healthz（存活探针）、GET /metrics（Prometheus 指标）。
    【假设】限流(429)与服务错(500)的业务 code 复用 HTTP 状态码（05 文档错误码表未定义）。
    【假设】/api/ai/chat 首期统一返回 JSON；SSE 流式后续另行扩展（原预留 Accept header 参数因实现未读取已从契约移除）。
    【假设】埋点 tag 为预留分组，34 接口清单中暂无埋点上报接口。
    【假设】列表默认按 created_at DESC，每页 20 条（page/page_size 上限 100）；金额单位元（2 位小数）、重量单位 g、热量单位 kcal。
servers:
  - url: /
    description: 同源部署（Nginx 反代 FastAPI）
security:
  - bearerAuth: []
tags:
  - name: 认证
    description: 微信登录、当前用户
  - name: 用户档案
    description: 身体档案（BMR/TDEE 输入）
  - name: 热量账户
    description: 每日热量快照与趋势
  - name: 记录
    description: 食物库、饮食/运动/步数记录
  - name: AI
    description: AI 对话、次数、饭点推荐
  - name: 商家
    description: LBS 商家列表/详情、标准 SKU 目录
  - name: 券
    description: 用户券列表
  - name: 订单
    description: 下单、支付、回调、核销、订单列表
  - name: 社区
    description: 邀请、动态、约战
  - name: 管理
    description: 运营看板
  - name: 埋点
    description: 【假设】预留分组，暂无接口
  - name: 教练工单
    description: 真人健身教练工单 / 专家问诊（G1：用户提问、教练回复、被分配用户）
  - name: 会员套餐
    description: 平台自营 AI+真人教练订阅付费（G2：档位/下单/支付/回调；路径族 /api/plan）
  - name: 体重
    description: 体重记录与趋势（Phase 1 / BE-w 新增）
  - name: 订阅
    description: 提醒订阅设置（Phase 1 / BE-n 新增）
  - name: 任务与积分
    description: 任务中心、每日签到、积分（明细/门槛）
  - name: 隐私
    description: 隐私开关（匿名/榜单可见性/数据导出）
  - name: 报告
    description: 热量控制周报与报告导出
  - name: 账户
    description: 账号注销（级联清除）
  - name: 商家自助
    description: 商家 token 登录与经营（选品定价/上下架/核销/看板）
  - name: 上传
    description: 腾讯云 COS 直传临时凭证（公开读/私有写；STS 临时密钥）
paths:
  /api/auth/login:
    post:
      tags: [认证]
      summary: 微信登录，code 换 token
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginData'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/auth/me:
    get:
      tags: [认证]
      summary: 当前用户
      operationId: authMe
      responses:
        '200':
          description: 当前登录用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/body-profile:
    post:
      tags: [用户档案]
      summary: 创建/更新身体档案
      operationId: upsertBodyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyProfileIn'
      responses:
        '200':
          description: 已保存（含服务端计算的 BMR/目标热量）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/BodyProfileOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [用户档案]
      summary: 查询身体档案
      operationId: getBodyProfile
      responses:
        '200':
          description: 身体档案；未创建时 data 为 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/BodyProfileOut'
                          - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account/today:
    get:
      tags: [热量账户]
      summary: 今日热量账户
      operationId: getAccountToday
      responses:
        '200':
          description: 今日热量快照（BMR/PAL/NEAT/TEF/TEE/摄入/缺口/步数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DailyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account/trend:
    get:
      tags: [热量账户]
      summary: 账户趋势（按日）
      operationId: getAccountTrend
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 按日趋势；【假设】缺省返回最近 7 天
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountTrendData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account/today-status:
    post:
      tags: [热量账户]
      summary: 写入当日状态（卧床/久坐/轻度/中度/高度五选一）
      operationId: setAccountTodayStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodayStatusIn'
      responses:
        '200':
          description: 写入成功并返回重算后的今日账户（当日 PAL/NEAT 取所选状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DailyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/food/custom:
    post:
      tags: [记录]
      summary: 新建用户自定义食物（仅本人可见，待审核）
      operationId: createCustomFood
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodCustomIn'
      responses:
        '200':
          description: 创建成功（audit_status 恒为 0 待审）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/FoodCustomData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/food/search:
    post:
      tags: [记录]
      summary: 食物搜索（PG 全文检索 + 别名）
      operationId: searchFood
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodSearchIn'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/FoodSearchData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/meal/recognize:
    post:
      tags: [记录]
      summary: 拍照识别食物
      operationId: recognizeMeal
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: 识别结果；置信度 < 0.7 时 need_confirm=true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RecognizeData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '409':
          $ref: '#/components/responses/AiUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/meal:
    post:
      tags: [记录]
      summary: 新增饮食记录
      operationId: createMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealCreateIn'
      responses:
        '200':
          description: 已写入并重算今日摄入
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MealCreatedData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/meal/{id}:
    put:
      tags: [记录]
      summary: 编辑饮食记录
      operationId: updateMeal
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealUpdateIn'
      responses:
        '200':
          description: 已更新并重算今日摄入
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MealCreatedData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [记录]
      summary: 删除饮食记录
      operationId: deleteMeal
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MealDeleteData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/meal/list:
    get:
      tags: [记录]
      summary: 饮食记录列表
      operationId: listMeals
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: meal_type
          in: query
          schema: { $ref: '#/components/schemas/MealType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页列表（默认按 created_at DESC）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MealPageData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sport:
    post:
      tags: [记录]
      summary: 新增运动记录
      operationId: createSport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportIn'
      responses:
        '200':
          description: 已写入并计入今日消耗
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SportCreatedData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/sport/list:
    get:
      tags: [记录]
      summary: 运动记录列表
      operationId: listSports
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SportPageData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/steps/sync:
    post:
      tags: [记录]
      summary: 同步步数（NEAT 校准）
      operationId: syncSteps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepsSyncIn'
      responses:
        '200':
          description: 校准结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StepsSyncData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation422'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ai/chat:
    post:
      tags: [AI]
      summary: AI 对话（校验剩余次数）
      operationId: aiChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatIn'
      responses:
        '200':
          description: 对话回复（引用知识库 id）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiChatData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 业务错（4001 次数用尽 / 6001 AI 服务暂不可用）
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - type: object
                        properties:
                          code: { const: 4001 }
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - type: object
                        properties:
                          code: { const: 6001 }
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ai/times:
    get:
      tags: [AI]
      summary: 查询剩余对话次数
      operationId: getAiTimes
      responses:
        '200':
          description: 剩余次数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiTimesData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ai/recommend:
    post:
      tags: [AI]
      summary: 饭点决策推荐
      operationId: aiRecommend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRecommendIn'
      responses:
        '200':
          description: 推荐选项（含推荐理由）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AiRecommendData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/AiUnavailable'
        '422':
          $ref: '#/components/responses/Validation422'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/merchant/list:
    get:
      tags: [商家]
      summary: 商家列表（LBS）
      operationId: listMerchants
      parameters:
        - name: lat
          in: query
          description: 纬度（-90 到 90）
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          description: 经度（-180 到 180）
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radius
          in: query
          description: 搜索半径（米）
          schema: { type: integer, default: 3000 }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 商家列表；传坐标时按权重分排序（拉新 40% + 券 40% + 过程 20%，同分距离近优先），无坐标按 id 升序；distance_m 为 haversine 距离，坐标缺失商家该字段为 null；【假设】不传经纬度时按默认城市返回
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantPageData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
