# ============================================================
# AI 饮食管控教练 · 本地开发/部署编排（P0-g）
# 启动：在本目录执行
#   cp ../.env.example ../.env   # 可选
#   docker compose up -d --build
# 一键语义：migrate 服务自动执行 alembic 迁移 + 种子导入，
#   api/worker 等其成功退出后才启动；up 结束即可访问 localhost。
# 生产关闭种子重灌：LOAD_SEEDS=false docker compose up -d
# 镜像 tag 由 GIT_SHA 决定（§10.6 回滚：切回上一 sha 镜像即可）
# ============================================================
name: ai-coach

services:
  postgres:
    # PostGIS 镜像（N-7：merchant.geo GEOMETRY(Point,4326) 需要 postgis 扩展）
    image: postgis/postgis:16-3.4
    container_name: ai-coach-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_coach}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化自动建表（PostGIS 扩展由镜像提供；001_schema.sql 含 CREATE EXTENSION IF NOT EXISTS）
      - ../data/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_coach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-coach-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性初始化：alembic 版本对齐 + 种子数据。api/worker 依赖其成功退出后启动，
  # 实现「docker compose up 即可用」。
  # 建表分工：表结构由 postgres 的 initdb.d（001_schema.sql）创建；
  # 本服务只在库中无 alembic 版本记录时 stamp 对齐 head（不重复建 DDL），
  # 已有版本记录则正常增量 upgrade head。种子默认 TRUNCATE 后重灌（幂等），
  # 生产环境如不允许覆盖参考数据，设 LOAD_SEEDS=false。
  migrate:
    image: ai-coach-api:${GIT_SHA:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: ai-coach-migrate
    env_file:
      - path: ../.env
        required: false
    environment:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_coach}
      SEED_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_coach}
      LOAD_SEEDS: ${LOAD_SEEDS:-true}
      # LOAD_SEEDS 走插值（同 api 段注释的机制），与 PAY_MOCK_MODE 那类坑的区别：
      # 它的真源本就是「命令行/shell 或 deploy/.env」——文件头与 .github/workflows/cd.yml
      # 都用 `LOAD_SEEDS=false docker compose up` 关闭种子重灌，这条路是通的。
      # ⚠️ 反过来：把它写进根 .env **无效**（会被本行 :-true 覆盖）。保持 `true` 默认
      #    是为了「compose up 即可用」的种子自动导入，故不删本行，只在此立此说明防腐。
      # ALEMBIC_DATABASE_URL / SEED_DSN 是**有意**覆盖（服务名 postgres + psycopg2/asyncpg
      # 双协议串，根 .env 的本机 DATABASE_URL 不适用），与 api/worker 同口径。
      # 超管账号的唯一真源是根 .env，由上面的 env_file 注入容器环境。
      # 这里【不要】再声明 ADMIN_INIT_USERNAME / ADMIN_INIT_PASSWORD：
      # environment 的优先级高于 env_file，用 ${VAR:-} 插出的空串会把 .env 里的
      # 真实凭据覆盖成空串（实测 username=EMPTY / password_len=0）。
      # 另注：${VAR} 插值只读 project directory（deploy/）下的 .env，根 .env 不参与插值，
      # 所以也不能用 ${VAR:?} 必填语法（会让本地 up 直接失败）。
      # 空凭据的兜底校验在 scripts/init_admin.py：它拒绝建号并返回非 0。
      # migrate 走 --optional：**凭据缺失**时打 info 日志、跳过建号、返回 0，
      # 让没有根 .env 的新机器/CI 仍能起栈（否则 migrate 非 0 退出 → api/worker
      # 的 service_completed_successfully 永不满足 → api/worker/nginx 全不启动）；
      # 凭据**存在但**是占位串/弱口令时仍按严格模式失败（那是"运维以为配好了"）。
      # 代价：无 .env 时超管不会被自动创建，需人工介入（见 init_admin.py 文件头）。
    volumes:
      # 种子 CSV/JSONL 在仓库根 data/，后端镜像不含，只读挂载
      - ../data:/app/data:ro
    command:
      - sh
      - -c
      - |
        set -e
        cur="$(alembic current 2>/dev/null | grep -oE '^[0-9a-f]{4,}' || true)"
        if [ -n "$$cur" ]; then
          alembic upgrade head
        else
          echo "库中无 alembic 版本记录（initdb.d 已建表）→ stamp 对齐 head"
          alembic stamp head
        fi
        if [ "$$LOAD_SEEDS" = "true" ]; then
          python data/load_seeds.py --dsn "$$SEED_DSN" \
            --file food:data/seeds/food_full.csv \
            --file food_alias:data/seeds/food_alias_full.csv \
            --file sku_catalog:data/seeds/standard_sku.sample.csv \
            --file ai_knowledge:data/seeds/rag_knowledge.sample.jsonl
        else
          echo "LOAD_SEEDS=false：跳过种子导入"
        fi
        # 超管初始化（幂等）：账号不存在则建；密码与 .env 不一致才更新哈希。
        # 放在种子导入之后，保证不受种子文件的 TRUNCATE/ON CONFLICT 影响
        # （003 种子已删除 admin 行，不再覆盖超管口令）。
        python scripts/init_admin.py --dsn "$$SEED_DSN" --optional
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ai-coach-api:${GIT_SHA:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: ai-coach-api
    env_file:
      # 长语法 required:false：.env 尚未创建时也能起容器（变量走默认值）
      - path: ../.env
        required: false
    environment:
      # ============================================================
      # 本块里只有「有意的覆盖」，其余一律交给 env_file(../.env)。
      # 机制提醒（P0 事故根因，AGENTS.md §7.1 记的 required:false 是同族坑）：
      #   ① environment: 的优先级**高于** env_file:，写在这里的键就是最终值；
      #   ② 但 ${VAR} 插值读的是 compose project 环境 = shell 环境变量 +
      #      deploy/.env（**本仓库不存在 deploy/.env**），根 .env **不参与插值**。
      #   ⇒ 在 environment 里多写一个键 = 用「deploy/.env 的值或 :- 默认值」
      #     覆盖掉根 .env 的同名值，静默失效且不报错。
      # 下面 4 行是**故意**覆盖的：POSTGRES_HOST/REDIS_HOST/DATABASE_URL/REDIS_URL
      # 必须指向 compose 服务名，本机调试值（127.0.0.1）在容器网络内不适用。
      # ⚠️ 副作用：这 4 行里的 ${POSTGRES_USER/-PASSWORD/-DB} 同样不读根 .env，
      #    改 DB 口令只能走 shell（`POSTGRES_PASSWORD=x docker compose up`）或
      #    新建 deploy/.env；且已初始化的 pgdata 卷不会随口令变更（initdb 仅空卷执行），
      #    postgres 服务那几个键与此处必须一致，否则 api 连不上。
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_coach}
      REDIS_URL: redis://redis:6379/0
      # PAY_MOCK_MODE 已从本块删除（2026-10-03 P0 修复）：
      #   原有 `PAY_MOCK_MODE: ${PAY_MOCK_MODE:-false}` 按上述机制恒为 false，
      #   把根 .env 的 PAY_MOCK_MODE=true 覆盖掉 → pay_order 走真实微信下单分支、
      #   永不 _mark_paid，订单停在 status=1 / pay_at=NULL / redeem_code=NULL，
      #   而前端照样 toast「支付成功(模拟)」——静默失效、不报代码错误。
      #   现由 env_file(../.env) 单源供给：根 .env 写 true 即生效；缺该键时后端
      #   pydantic 默认 False（app/core/config.py，生产安全侧），不再有第二真源。
    volumes:
      - uploads:/app/uploads
      - logs:/var/log/app          # 日志落盘（§10.7；Cron 打包上传 COS 保留 30 天）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 容器内无 curl，用 python urllib 探活；端口与 Dockerfile CMD（8000）一致
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 日志落盘 + 轮转（宿主 /var/lib/docker/containers，单文件 20m、保留 5 份）
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  # 后台任务 worker（§10.3）：复用后端镜像，跑每日热量快照（app/tasks/snapshot.py）。
  # Dockerfile.backend 无 worker 入口，故此处给出合理 CMD：每日循环执行一次幂等快照。
  # 生产推荐改用 APScheduler/cron 或 Redis Streams 常驻消费者（见 snapshot.py 文档串）。
  worker:
    image: ai-coach-api:${GIT_SHA:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: ai-coach-worker
    env_file:
      - path: ../.env
        required: false
    environment:
      # 同 api：本块只保留**有意**的服务名覆盖（4 行，机制见 api 段注释）。
      # 这里没有 PAY_MOCK_MODE 之类的键——worker 不跑支付，其余业务开关
      # （AI_*/RATE_LIMIT_*/JWT_* 等）一律由 env_file(../.env) 单源供给，
      # 新增覆盖请先读 api 段那段「environment 优先级高于 env_file」的说明。
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_coach}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "while true; do python -m app.tasks.snapshot --once || true; sleep 86400; done"]
    # worker 为循环任务非 HTTP 服务，禁用继承自 Dockerfile 的 /healthz 探活
    healthcheck:
      disable: true
    volumes:
      - logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  # 一次性构建：管理后台静态产物（admin 的 vue-tsc + vite build）。
  # 产物落独立具名卷 admin_dist（nginx 挂它），**不回写宿主 admin/ 目录**。
  # 为什么需要 node: 容器内 npm ci 可复现安装（宿主 node_modules 不进构建上下文），
  # 且不需要宿主装 Node。node_modules 与产物各走独立具名卷，避免 bind mount 的
  # Windows/WSL 跨文件系统写入过慢与符号链接问题。
  # 安全加固（2026-10-03）：
  # 1) ../admin 改挂 :ro —— npm ci 会执行第三方生命周期脚本（lockfile 中
  #    hasInstallScript=true 的有 esbuild / fsevents），RW 挂载等于把宿主 admin/
  #    的写权限交给容器内代码；构建产物已改走 admin_dist 卷，无需写回源码目录。
  # 2) user: "1000:1000"（node 镜像自带非 root 用户 node）——不以 root 跑 npm。
  # 3) 具名卷默认属 root:root，非 root 写不了；admin-volumes-init 服务（root、一次性）
  #    负责把两个卷 chown 给 1000:1000，admin-build 依赖它成功退出。
  admin-volumes-init:
    image: node:22-alpine
    container_name: ai-coach-admin-volumes-init
    user: "0:0"
    volumes:
      # 挂载路径只是卷的引用点，与 admin-build 里的 /work 是同一个卷：
      # 目的是把卷内容（缓存依赖）chown 给 1000:1000。
      - admin_node_modules:/mnt/node_modules
      - admin_dist:/out
    command: ["sh", "-c", "chown -R 1000:1000 /mnt/node_modules /out && echo 'admin 构建卷已归属 1000:1000'"]
    restart: "no"

  admin-build:
    image: node:22-alpine
    container_name: ai-coach-admin-build
    user: "1000:1000"
    working_dir: /work
    volumes:
      # ⚠️ 源码目录保持 :ro 只读（安全加固），但**不能**再把 node_modules 具名卷
      #    挂到这个 ro bind 的子路径上：GitHub runner 的新版 docker 在 ro bind 下
      #    建挂载点会报 "mkdirat ...: read-only file system"（2026-10-03 CI 实测）。
      #    故改为：源码 tar 进卷内工作区 /work（排除 node_modules，npm ci 重建），
      #    依赖缓存语义由同一具名卷保留。
      - ../admin:/repo:ro
      - admin_node_modules:/work
      - admin_dist:/out
    command:
      - sh
      - -c
      - |
        set -e
        tar -C /repo --exclude=./node_modules -cf - . | tar -C /work -xf -
        # 国内 npm 镜像：部署机直连 registry.npmjs.org 常不通/超时，会让本服务失败。
        # 与 Dockerfile.backend 里 PIP_INDEX_URL 必须覆盖 mirrors.tencent.com 同理
        # （buildkit 内 SSL 失败），这里显式切到 npmmirror。
        npm config set registry https://registry.npmmirror.com
        npm ci --no-audit --no-fund
        # 产物写到独立具名卷（../admin 只读，不能再落 admin/dist）
        npm run build -- --outDir /out
        # 断言产物真的落到卷上：若 base 配错或 vite 配置变更改了 outDir，
        # 这里立刻失败而不是静默 404。
        test -f /out/index.html
        echo "admin 静态产物已生成：卷 admin_dist → nginx /usr/share/nginx/html/admin"
    depends_on:
      admin-volumes-init:
        condition: service_completed_successfully
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-coach-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/uploads:ro
      # 管理后台构建产物：由 admin-build 服务在 up 时生成（具名卷 admin_dist）。
      # 不能省——缺了它 nginx 的 ^~ /admin/ 会因 alias 目标不存在而内部重定向死循环（500）。
      - admin_dist:/usr/share/nginx/html/admin:ro
      # 生产 443：Let's Encrypt 证书目录（Certbot 自动续期）：
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
      # 权衡（2026-10-03）：admin-build 依赖部署机 npm 网络，失败概率显著高于后端镜像构建。
      # 若用 service_completed_successfully，admin 构建一失败 nginx 就不启动 → /api 反代与
      # /healthz 一并不可用（把后台页面可用性绑架到全站可用性上）。
      # 故降级为 service_started：API 可用性优先于后台页面可用性——admin 构建失败时
      # /admin/ 返回 404（缺产物），/api 与 /healthz 仍可用。
      # 仍保留依赖只为保证"正常情况下 nginx 起来时产物已在卷上"。
      admin-build:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  # ---- 监控（F9 / §10.7）：Prometheus 采集 /metrics，Grafana 看板 ----
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-coach-prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-coach-grafana
    environment:
      # ⚠️ 同 api 段那个坑的**未修复孪生**（2026-10-03 记录）：grafana 服务**没有 env_file**，
      #    本行只靠 compose 插值，而插值只认 shell 环境变量 / deploy/.env（后者不存在）——
      #    根 .env 里的 GRAFANA_ADMIN_PASSWORD 走到这里必然落空（当前根 .env 也确实没这个键），
      #    实测 GF_SECURITY_ADMIN_PASSWORD 落默认值 admin。
      #    正确用法：GRAFANA_ADMIN_PASSWORD=xxx docker compose up -d grafana（.env.example:97
      #    把它写成根 .env 的键，属文档误导；.env.example 不在本次可写范围，未改）。
      #    本次只重建 api/worker/nginx，未动 grafana，故此处只留说明不改语义。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      # provisioning 自动装配数据源与看板（开箱即用，无需手动导入）：
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/ai-coach-f9.json:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:
  promdata:
  grafanadata:
  admin_node_modules:   # admin-build 的依赖目录（宿主 admin/node_modules 不参与，见 admin-build 注释）
  admin_dist:           # admin-build 的静态产物（nginx 挂载它，不再回写宿主 admin/dist）
