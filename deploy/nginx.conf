# AI 饮食管控教练 · Nginx 入口
# - 80：开发/内网直连（保留完整路由，dev 无证书也能用）
# - 443：生产入口（Let's Encrypt + Certbot 自动续期）——**未默认启用**，配置在
#        nginx-ssl.conf.example，生成证书后按文件末尾步骤复制为 nginx-ssl.conf 再挂载
# 说明：本文件由 compose 挂进 nginx:1.27-alpine 容器实跑（conf.d/default.conf），
#      2026-10-02 本机 WSL docker 已实测：nginx -t syntax ok、:80 反代 /api → api:8000 通、
#      /healthz 回 ok。原注释"本沙箱无 Docker/无 nginx 二进制，无法真跑"已被证伪，故改写。

# 限流 100r/s（§10.4）
limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;

# ============================================================
# 上游解析（2026-10-03 修复 P1：api 容器重建后 nginx 连旧 IP → 全站 502）
# 旧写法只有 `upstream api_server { server api:8000; }` + `proxy_pass http://api_server;`。
# nginx 对 upstream 里的域名**只在启动/reload 时静态解析一次**并缓存结果 IP；
# api 容器被重建（--force-recreate / 镜像滚动 / OOM 重启 / 宿主 docker 重启）后
# IP 变了（实测 172.21.0.6 → 新 IP），nginx 仍连旧 IP，/api/* 全线 502，
# 必须人工 `docker exec ai-coach-nginx nginx -s reload` 才恢复——本会话内打断过两波 E2E，
# 且一度把环境故障误判成代码故障。
# 现改为**运行时解析**：Docker 内置 DNS（127.0.0.11）+ valid=10s，
# 且只有**变量形式**的 proxy_pass 才会走 resolver（字面量 proxy_pass / upstream 块
# 一律走启动期解析，这是 nginx 的固有行为，不是配置能绕开的）。见下方 /api/ 块。
# 代价：变量 proxy_pass 用不到 upstream 块的 keepalive（每请求新建上游连接）。
# 本栈单机、限流 100r/s，连接开销可接受，换来的是「api 重建免 reload 自愈」。
# ipv6=off：docker DNS 对服务名不返 AAAA，关掉省一次查询、避免 v6 回落延迟。
# ============================================================
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

upstream api_server {
    # ⚠️ 保留但 **80 端口已不再引用它**（/api/ 改用 $api_upstream 变量，见文件头）。
    # 留着的原因：deploy/nginx-ssl.conf.example:40 仍写 proxy_pass http://api_server;，
    # 该文件不在本次可写范围；删掉本块会让它启用 443 时 nginx -t 直接失败
    # （api_server 被当成无法解析的主机名）。
    # 启用 ssl 示例时，请把它同步改成与 /api/ 块相同的 resolver + 变量写法，
    # 否则 443 入口会重新踩回本文件头描述的这个 502 坑。
    # 注：本块仍会在启动期解析 api:8000（api 容器未就绪时 nginx 起不来），
    # compose 的 depends_on: api(service_started) 保证顺序。
    server api:8000;
    keepalive 32;
}

# ============================================================
# 80：开发/内网
# 生产启用「强制跳 443」：取消下面 return 301 的注释即可（同时建议停用本块内的业务路由）
# ============================================================
server {
    listen 80;
    server_name _;

    # 生产（有证书后）启用：80 强制跳 443
    # return 301 https://$host$request_uri;

    client_max_body_size 20m;   # 食物照片上传

    # ---- gzip ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---- API 反代（^~ 前缀匹配优先于正则；后端路由挂载在 /api 前缀下）----
    location ^~ /api/ {
        limit_req zone=perip burst=200 nodelay;
        # 变量化上游 → 走文件头的 resolver 运行时解析（api 容器重建后免 reload）。
        # ⚠️ proxy_pass 一旦含变量，URI 拼接语义就变了：**不再**自动带上 location 前缀，
        #    所以必须显式追加 $request_uri 原样透传（含 query string）。
        #    后端路由挂在 /api 前缀下（config.API_PREFIX=/api），靠这个前缀命中，不能省。
        #    $request_uri 自带前导 `/`，故 $api_upstream 末尾**不能**再写 `/`
        #    （写成 http://api:8000/ 会拼出 //api/…  → 后端 404）。
        #    本写法与改前 `proxy_pass http://api_server;`（不带 URI → 原样透传）逐字等价。
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;   # AI 对话超时降级由后端控制
    }

    # ---- 管理后台静态（admin 构建产物由 compose 的 admin-build 服务产出并挂载到
    #      /usr/share/nginx/html/admin；admin 用 hash 路由，index.html 自持 SPA 回退）----
    # 无尾斜杠的 /admin 不匹配下方 ^~ /admin/，会落到 nginx 编译默认 root 报 404，
    # 故显式 301 到规范路径（/admin/）。absolute_redirect off 保证 Location 保持
    # 相对路径 —— 否则 nginx 会用 $host 把它展开成绝对 URI，反射请求的 Host 头
    # （Host: evil.example.com → Location: http://evil.example.com/admin/）。
    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        # 只回退到 index.html 一次：alias 目标目录不存在时 try_files 会全部 miss，
        # 末项若也解析不到就会内部重定向回本 location 造成死循环（nginx 报
        # "rewrite or internal redirection cycle"，前端收到 500 而非 404）。
        try_files $uri $uri/ /admin/index.html;
        # 防嵌套（点击劫持）：admin 有 9 个写端点、token 存 localStorage，
        # 被 iframe 嵌套即可驱动已登录超管执行写操作。
        # 只加在 /admin/ 块——/api/ 是 JSON API，加了无意义且可能干扰 CORS。
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # ---- 媒体/上传文件（COS 接入前的本地兜底，compose 挂载 uploads 卷）----
    location ^~ /uploads/ {
        alias /uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- 探活（仅内网使用；/metrics 不做 nginx 暴露，由 Prometheus 直连 api:8000）----
    location = /healthz {
        return 200 "ok";
    }

    # 刻意不设站点根 location / server 级 root：本项目只交付微信小程序，H5 产物不部署
    # （compose 的 nginx 未挂载任何 H5 产物，容器 /usr/share/nginx/html 仅 nginx 默认页）。
    # 未命中 /api/ /admin/ /uploads/ /healthz 的路径按 nginx 默认 404 处理即可；
    # 管理后台的 SPA 回退由上方 ^~ /admin/ 块自持（admin 走 hash 路由，不依赖根回退）。
}

# 443 生产入口已拆分至 nginx-ssl.conf.example：生成证书后
#   cp deploy/nginx-ssl.conf.example deploy/nginx-ssl.conf
# 并在 compose nginx.volumes 追加：- ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
