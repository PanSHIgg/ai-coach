# AI 饮食管控教练 · Nginx 入口（开发环境仅 80；生产 443/Let's Encrypt 占位见文末）

# 限流 100r/s（§10.4）
limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;

upstream api_server {
    server api:8000;
    keepalive 32;
}

# 生产环境启用：80 强制跳 443
# server {
#     listen 80;
#     server_name your.domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;   # 食物照片上传

    # ---- gzip ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---- API 反代（^~ 避免被下方静态缓存正则抢占；后端路由挂载在 /api 前缀下）----
    location ^~ /api/ {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass http://api_server;   # 不带 URI，保留 /api/ 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;   # AI 对话超时降级由后端控制
    }

    # ---- 管理后台静态（admin 构建产物挂载到 /usr/share/nginx/html/admin）----
    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 媒体/上传文件（COS 接入前的本地兜底，compose 挂载 uploads 卷）----
    location ^~ /uploads/ {
        alias /uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- 探活 ----
    location = /healthz {
        return 200 "ok";
    }

    # ---- 静态资源缓存 7 天（§10.4）----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- 站点根（HTML 不缓存）----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

