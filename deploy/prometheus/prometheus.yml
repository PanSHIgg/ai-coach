# Prometheus 采集配置（F9 / docs/split/08 §10.7）
# 说明：容器编排里 api 服务名即主机名（deploy/docker-compose.yml），故目标为 api:8000。
# Prometheus 原生不支持 ${VAR} 插值，环境差异请用 label 或在部署时用 envsubst 渲染另存。

global:
  scrape_interval: 15s        # 采集间隔
  scrape_timeout: 10s
  evaluation_interval: 15s    # 告警规则求值间隔
  external_labels:
    monitor: ai-coach

# 告警规则文件（与本源同目录）
rule_files:
  - alert.rules.yml

scrape_configs:
  # 后端 API：/metrics 为运维端点（非 /api 契约前缀）
  - job_name: ai-coach-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: ai-coach-api
          env: prod

  # Redis：oliver006/redis_exporter（内存、连接、命中率、驱逐/过期、命令耗时）
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: ai-coach-redis
          env: prod

  # PostgreSQL：prometheuscommunity/postgres_exporter（连接数、事务、缓存命中、库大小、锁、复制）
  # 注意：pg_stat_database_* 覆盖实例内**所有**库（本机还留着并行 agent 的 slot 库），
  # 面板与告警一律按 datname 过滤，见 dashboard「基础设施」行。
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: ai-coach-postgres
          env: prod

  # Prometheus 自采（便于观察采集/规则求值健康度）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]