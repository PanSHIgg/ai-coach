[project]
name = "ai-coach-backend"
version = "0.1.0"
description = "AI 饮食管控教练 · FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.8,<3.0",
    # multipart/form-data 解析（/api/meal/recognize 图片上传）
    "python-multipart>=0.0.9,<0.1",
    # 腾讯云 COS 直传：STS 临时密钥签发（04 文档 §6.1 对象存储）
    "qcloud-python-sts>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "black>=24.4,<25.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
